# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: کریستالین
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: fa-IR
  baseUrl: blog.eledah.ir
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Ray-ExtraBold
      body: Vazirmatn
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#F8F8F8"
        lightgray: rgb(242, 240, 229)
        gray: rgb(206, 205, 195)
        darkgray: rgb(16, 15, 15)
        dark: rgb(16, 15, 15)
        secondary: rgb(139, 126, 200)
        tertiary: rgb(94, 64, 157)
        highlight: rgba(94, 64, 157, 0.15)
        textHighlight: rgba(94, 64, 157, 0.15)
      darkMode:
        light: rgb(16, 15, 15)
        lightgray: rgb(40, 39, 38)
        gray: "#9f9898"
        darkgray: rgb(214, 211, 203)
        dark: rgb(206, 205, 195)
        secondary: "#a68adf"
        tertiary: "#846aff"
        highlight: rgba(139, 126, 200, 0.15)
        textHighlight: rgba(139, 126, 200, 0.15)
plugins:
  - source: ./plugins/date-field
    enabled: true
    order: 8
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: ./plugins/bidi-text
    enabled: true
    order: 35
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: left
      priority: 40
      display: desktop-only
      condition: not-index
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
    options:
      header: Ray-ExtraBold
      body: Vazirmatn
      code: IBM Plex Mono
      useThemeFonts: false
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/explicit-publish
    enabled: false
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:quartz-community/encrypted-pages
    enabled: false
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: false
  - source: github:quartz-community/cname
    enabled: true
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: ./plugins/featured-cards
    enabled: true
    layout:
      position: beforeBody
      priority: 7
      component: FeaturedCards
  - source: ./plugins/featured-cards
    enabled: true
    order: 36
    layout:
      position: beforeBody
      priority: 22
      condition: not-index
      component: FeaturedImage
  - source: github:quartz-community/graph
    enabled: true
    options:
      localGraph:
        removeTags:
          - explorerexclude
      globalGraph:
        removeTags:
          - explorerexclude
    layout:
      position: right
      priority: 10
      display: desktop-only
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 30
      display: desktop-only
  - source: github:quartz-community/backlinks
    enabled: true
    layout:
      position: right
      priority: 50
      display: desktop-only
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
      condition: not-index
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: ./plugins/blog-extras
    enabled: true
    layout:
      position: left
      priority: 5
      display: desktop-only
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 20
      display: desktop-only
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: true
    layout:
      position: left
      priority: 25
      display: desktop-only
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: true
    options:
      provider: giscus
      options:
        repo: eledah/quartz_blog
        repoId: R_kgDOLxbW_g
        category: Announcements
        categoryId: DIC_kwDOLxbW_s4ChRbJ
        mapping: url
        strict: true
        reactionsEnabled: true
        inputPosition: bottom
        lightTheme: https://cdn.jsdelivr.net/gh/eledah/quartz_blog/quartz/static/giscus-light.css
        darkTheme: https://cdn.jsdelivr.net/gh/eledah/quartz_blog/quartz/static/giscus-dark.css
        lang: fa
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: github:quartz-community/recent-notes
    enabled: true
    options:
      title: یادداشت‌های اخیر
      limit: 3
      linkToMore: false
      showTags: false
      hideTagPages: true
      hideFolderPages: true
    layout:
      position: right
      priority: 25
      display: desktop-only
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - date
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: "---"
      language: yaml
    order: 5
layout:
  groups:
    toolbar:
      priority: 20
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      exclude:
        - explorer
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
